<div class="container">
    <div class="row">
        <div class="col-md-6 offset-md-3">
            <form class="login-form">
                <div>
                    <label for="username">Username</label>
                    <input type="text" id="username" name="username" required [formControl]="email">
                </div>
                <div >
                    <label for="password">Password</label>
                    <input type="password" id="password" name="password" required [formControl]="password">
                </div>
                <button type="submit" [disabled]="email.invalid || password.invalid" (click)="onLogin()" class="btn btn-primary btn-block">Login</button>
            </form>




        </div>
    </div>
</div>

<h1>FormGroup</h1>
<form [formGroup]="UserForm">
  <div >
    <label >Name:</label>
    <input type="text" class="form-control" formControlName="name">
    <div class="alert alert-danger" *ngIf="UserForm.controls['name'].invalid && UserForm.controls['name'].touched" class="text-danger">
      <p *ngIf="UserForm.controls['name'].hasError('required')">Name is required</p>
      <p *ngIf="UserForm.controls['name'].hasError('minlength')">Name must be at least 5 characters long.</p>

    </div>
</div>
    <div >
    <label >Email:</label>
    <input type="email" class="form-control" formControlName="email">
</div>
    <div >
    <label >Phone:</label>
    <input type="tel" class="form-control" formControlName="phone">
</div>
    <div >
    <label >Address:</label>
    <input type="text"  formControlName="address">
 </div>
    <div >
    <label >Password:</label>
    <input type="password" class="form-control" formControlName="password" >
    </div>
  <button type="submit" [disabled]="UserForm.invalid">Login</button>
  </form>
